name: VPS remote check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host key
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Mail folders check
        run: |
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
          set +e
          echo "==> dovecot: $(systemctl is-active dovecot 2>/dev/null)"
          echo "==> doveadm mailbox list boris@qhub.kz"
          doveadm mailbox list -u boris@qhub.kz 2>&1
          echo "==> maildir /var/mail/vhosts/qhub.kz/boris"
          ls -la /var/mail/vhosts/qhub.kz/boris/ 2>&1
          EOF
