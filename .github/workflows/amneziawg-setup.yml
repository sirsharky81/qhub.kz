name: AmneziaWG setup (Russia)

on:
  workflow_dispatch:
    inputs:
      clients:
        description: "Client names (comma-separated, e.g. sofia,mama)"
        required: false
        default: ""

concurrency:
  group: amneziawg-setup
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host key
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Install AmneziaWG on VPS
        run: |
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
          set -euo pipefail
          cd /var/www/qhub.kz
          git fetch origin main
          git reset --hard origin/main
          chmod +x scripts/deploy/amneziawg-bootstrap.sh scripts/vpn/amnezia-client.sh
          sudo bash scripts/deploy/amneziawg-bootstrap.sh || true
          sudo bash scripts/vpn/amnezia-client.sh status || echo "awg0 not up — reboot VPS and re-run workflow"
          EOF

      - name: Create AmneziaWG clients
        if: inputs.clients != ''
        run: |
          CLIENTS="${{ inputs.clients }}"
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo bash /var/www/qhub.kz/scripts/vpn/amnezia-client.sh add ${CLIENTS//,/ }"

      - name: Download client QR artifacts
        if: inputs.clients != ''
        run: |
          mkdir -p amnezia-clients
          IFS=',' read -ra NAMES <<< "${{ inputs.clients }}"
          for name in "${NAMES[@]}"; do
            name="$(echo "$name" | xargs)"
            [ -z "$name" ] && continue
            scp -o BatchMode=yes \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/awg/clients/${name}/${name}.vpnuri.png" \
              "amnezia-clients/${name}-vpnuri.png" 2>/dev/null \
              || scp -o BatchMode=yes \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/awg/clients/${name}/${name}.png" \
              "amnezia-clients/${name}.png" 2>/dev/null \
              || echo "No QR for ${name}"
            scp -o BatchMode=yes \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/awg/clients/${name}/${name}.conf" \
              "amnezia-clients/${name}.conf" 2>/dev/null || true
          done
          ls -la amnezia-clients/ || true

      - name: Upload client configs (admin only)
        if: inputs.clients != ''
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-clients
          path: amnezia-clients/
          retention-days: 7
