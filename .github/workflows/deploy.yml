name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g npm@11.18.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host key
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
          set -euo pipefail
          cd /var/www/qhub.kz
          git fetch origin main
          git reset --hard origin/main
          sed -i 's/\r$//' scripts/deploy/vps-deploy.sh
          bash scripts/deploy/vps-deploy.sh
          EOF

      - name: Migrate WireGuard to UDP 443 (root)
        run: |
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
          set -euo pipefail
          cd /var/www/qhub.kz
          chmod +x scripts/vpn/migrate-listen-port.sh scripts/vpn/restart-wg.sh
          sudo VPN_LISTEN_PORT=443 bash scripts/vpn/migrate-listen-port.sh \
            || sudo bash scripts/vpn/restart-wg.sh
          wg show wg0 | awk '/listening port:/ {print "WireGuard listen port:", $3}'
          pm2 restart qhub
          EOF

      - name: Ensure AmneziaWG for Russia (root)
        run: |
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
          set -euo pipefail
          cd /var/www/qhub.kz
          if [ -x scripts/deploy/amneziawg-bootstrap.sh ]; then
            if awg show awg0 >/dev/null 2>&1; then
              echo "AmneziaWG awg0 already running"
              awg show awg0 | awk '/listening port:/ {print "AmneziaWG listen port:", $3}'
            else
              echo "Installing AmneziaWG (may need reboot + re-deploy if first run)..."
              sudo bash scripts/deploy/amneziawg-bootstrap.sh || true
            fi
          fi
          EOF
