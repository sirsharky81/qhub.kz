name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g npm@11.18.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host key
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure Redis (before deploy)
        continue-on-error: true
        run: |
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF' || true
          cd /var/www/qhub.kz
          git fetch origin main
          git checkout origin/main -- scripts/deploy/repair-redis.sh scripts/deploy/ensure-redis.sh 2>/dev/null || true
          chmod +x scripts/deploy/repair-redis.sh scripts/deploy/ensure-redis.sh 2>/dev/null || true
          sudo bash scripts/deploy/repair-redis.sh || true
          EOF

      - name: Deploy on VPS
        run: |
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
          set -euo pipefail
          cd /var/www/qhub.kz
          git fetch origin main
          git reset --hard origin/main
          sed -i 's/\r$//' scripts/deploy/vps-deploy.sh
          bash scripts/deploy/vps-deploy.sh
          EOF

      - name: Migrate VPN ports for Russia (Amnezia UDP 443)
        continue-on-error: true
        run: |
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF' || true
          cd /var/www/qhub.kz
          sudo systemctl start redis-server 2>/dev/null || true
          chmod +x scripts/vpn/migrate-russia-ports.sh scripts/vpn/migrate-amnezia-port.sh \
            scripts/vpn/migrate-listen-port.sh scripts/vpn/restart-wg.sh 2>/dev/null || true
          if awg show awg0 >/dev/null 2>&1; then
            sudo bash scripts/vpn/migrate-russia-ports.sh \
              || sudo AMNEZIAWG_PORT=443 bash scripts/vpn/migrate-amnezia-port.sh || true
            awg show awg0 | awk '/listening port:/ {print "AmneziaWG listen port:", $3}'
          else
            sudo VPN_LISTEN_PORT=443 bash scripts/vpn/migrate-listen-port.sh \
              || sudo bash scripts/vpn/restart-wg.sh || true
            wg show wg0 2>/dev/null | awk '/listening port:/ {print "WireGuard listen port:", $3}' || echo "wg0 not up"
          fi
          EOF

      - name: Repair AmneziaWG for Russia (upgrade + regen)
        continue-on-error: true
        run: |
          ssh -o BatchMode=yes -o ServerAliveInterval=30 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF' || true
          cd /var/www/qhub.kz
          chmod +x scripts/vpn/repair-amnezia-russia.sh 2>/dev/null || true
          if [ -x scripts/vpn/repair-amnezia-russia.sh ]; then
            sudo bash scripts/vpn/repair-amnezia-russia.sh || true
          fi
          EOF

      - name: Ensure AmneziaWG for Russia (root)
        continue-on-error: true
        run: |
          ssh -o BatchMode=yes -o ServerAliveInterval=30 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF' || true
          cd /var/www/qhub.kz
          if [ -x scripts/deploy/amneziawg-bootstrap.sh ]; then
            if awg show awg0 >/dev/null 2>&1; then
              echo "AmneziaWG awg0 already running"
              awg show awg0 | awk '/listening port:/ {print "AmneziaWG listen port:", $3}'
            else
              echo "Installing AmneziaWG (installer may reboot VPS — re-deploy to continue)..."
              sudo bash scripts/deploy/amneziawg-bootstrap.sh || true
            fi
          fi
          EOF

      - name: Create AmneziaWG client for Russia (root)
        continue-on-error: true
        run: |
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF' || true
          if awg show awg0 >/dev/null 2>&1 && [ -x /var/www/qhub.kz/scripts/vpn/amnezia-client.sh ]; then
            sudo bash /var/www/qhub.kz/scripts/vpn/amnezia-client.sh add sofia 2>/dev/null || \
              sudo bash /root/awg/manage_amneziawg.sh list 2>/dev/null || true
          fi
          EOF

      - name: Final Redis + VPN diagnostics
        continue-on-error: true
        run: |
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF' || true
          cd /var/www/qhub.kz
          chmod +x scripts/deploy/repair-redis.sh scripts/vpn/diagnose-amnezia.sh \
            scripts/vpn/amnezia-client.sh scripts/vpn/apply-russia-hetzner-i1.sh \
            scripts/vpn/generate-quic-i1.mjs 2>/dev/null || true
          sudo bash scripts/deploy/repair-redis.sh || true
          if awg show awg0 >/dev/null 2>&1; then
            sudo bash scripts/vpn/apply-russia-hetzner-i1.sh || true
            sudo bash scripts/vpn/amnezia-client.sh regen-all || true
          fi
          sudo bash scripts/vpn/diagnose-amnezia.sh || true
          pm2 restart qhub 2>/dev/null || true
          EOF

      - name: Ensure standard mail folders
        continue-on-error: true
        run: |
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
          set +e
          cd /var/www/qhub.kz
          git fetch origin main
          git checkout origin/main -- scripts/mail/mail-init-folders.sh scripts/mail/apply-fast-submission.sh scripts/mail/mail-inbound-trace.sh scripts/mail/mail-outbound-trace.sh scripts/mail/mail-queue-status.sh scripts/mail/config/dovecot-15-mailboxes.conf 2>/dev/null || true
          chmod +x scripts/mail/mail-init-folders.sh scripts/mail/apply-fast-submission.sh scripts/mail/mail-inbound-trace.sh scripts/mail/mail-outbound-trace.sh scripts/mail/mail-queue-status.sh 2>/dev/null || true
          if [ -x scripts/mail/apply-fast-submission.sh ]; then
            sudo bash scripts/mail/apply-fast-submission.sh || true
          fi
          if [ -f scripts/mail/config/dovecot-15-mailboxes.conf ]; then
            cp scripts/mail/config/dovecot-15-mailboxes.conf /etc/dovecot/conf.d/15-mailboxes.conf
            systemctl reload dovecot
            echo "==> Dovecot special-use folders configured"
          fi
          if [ -x scripts/mail/mail-init-folders.sh ]; then
            bash scripts/mail/mail-init-folders.sh boris@qhub.kz
          fi
          if [ -x scripts/mail/mail-inbound-trace.sh ]; then
            bash scripts/mail/mail-inbound-trace.sh boris@qhub.kz doping@mail.ru bokhmarnyy@gmail.com || true
          fi
          if [ -x scripts/mail/mail-outbound-trace.sh ]; then
            bash scripts/mail/mail-outbound-trace.sh boris@qhub.kz 48 || true
          fi
          if [ -x scripts/mail/mail-queue-status.sh ]; then
            bash scripts/mail/mail-queue-status.sh || true
          fi
          echo "==> postfix queue summary"
          mailq 2>/dev/null || postqueue -p 2>/dev/null || true
          echo "deferred files: $(find /var/spool/postfix/deferred -type f 2>/dev/null | wc -l)"
          echo "active files: $(find /var/spool/postfix/active -type f 2>/dev/null | wc -l)"
          echo "hold files: $(find /var/spool/postfix/hold -type f 2>/dev/null | wc -l)"
          echo "==> boris outbound last 30 min"
          grep "boris@qhub.kz" /var/log/mail.log 2>/dev/null | tail -40 || true
          echo "==> smtp connections now"
          ss -tn state established '( sport = :587 or sport = :25 )' 2>/dev/null || true
          doveadm mailbox list -u boris@qhub.kz
          echo "==> pm2 qhub"
          pm2 status qhub 2>/dev/null || true
          pm2 logs qhub --lines 30 --nostream 2>/dev/null || true
          EOF
