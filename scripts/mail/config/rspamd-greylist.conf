# QHub — skip greylist when SPF, DKIM, or DMARC passes (mail.ru, Gmail, etc.)
# File: /etc/rspamd/local.d/greylist.conf — merges into greylist {} from modules.d (no nested block).
whitelist_symbols = [
  "R_SPF_ALLOW",
  "R_DKIM_ALLOW",
  "DMARC_POLICY_ALLOW",
  "WHITELIST_SPF",
  "WHITELIST_DKIM",
  "WHITELIST_DMARC",
  "WHITELIST_SPF_DKIM",
];
