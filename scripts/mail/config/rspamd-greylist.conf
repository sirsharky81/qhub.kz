# QHub — skip greylist when SPF, DKIM, or DMARC passes (mail.ru, Gmail, etc.)
# Merged into rspamd local.d/greylist.conf (see modules.d/greylist.conf duplicate=merge).
greylist {
  whitelist_symbols = [
    "R_SPF_ALLOW",
    "R_DKIM_ALLOW",
    "DMARC_POLICY_ALLOW",
    "WHITELIST_SPF",
    "WHITELIST_DKIM",
    "WHITELIST_DMARC",
    "WHITELIST_SPF_DKIM",
  ];
}
